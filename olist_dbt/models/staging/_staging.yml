version: 2

models:
  - name: stg_orders
    columns:
      - name: order_id
        tests: [unique, not_null]

  - name: stg_customers
    columns:
      - name: customer_id
        tests: [unique, not_null]

  - name: stg_order_reviews
    columns:
      - name: order_id
        tests: [unique, not_null]

  - name: stg_products
    columns:
      - name: product_id
        tests: [unique, not_null]

  - name: stg_sellers
    columns:
      - name: seller_id
        tests: [unique, not_null]

  - name: stg_geolocation
    columns:
      - name: zip_code_prefix
        tests: [unique, not_null]